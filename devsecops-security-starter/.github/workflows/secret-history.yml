name: Manual Secret History Scan

on:
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan full Git history (recommended)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan current tree
        run: gitleaks dir --config security/gitleaks.toml .
      - name: Scan full history
        if: inputs.full_history
        run: gitleaks git --config security/gitleaks.toml .
